```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no,
          viewport-fit=cover">

    <title>I am Sandy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100dvh;
        }

        /* ================= MAIN PAGE ================= */

        .page {
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;

            padding:
                clamp(12px, 2vh, 30px)
                clamp(15px, 5vw, 70px);

            position: relative;
            overflow: hidden;
        }

        /* ================= TITLE ================= */

        .title {
            text-align: center;
            flex-shrink: 1;
            z-index: 2;

            animation: titleIn 1s ease forwards;
        }

        .title h1 {
            font-size: clamp(42px, 7vw, 82px);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -3px;

            color: #000;

            text-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .title .name {
            display: block;

            margin-top: clamp(8px, 1.5vh, 18px);

            font-size: clamp(20px, 3vw, 34px);
            font-weight: 500;
            letter-spacing: 5px;

            color: #222;

            animation: nameFloat 4s ease-in-out infinite;
        }

        /* ================= HEADER IMAGE ================= */

        .header-glass {
            width: min(1100px, 94vw);

            height: clamp(150px, 30vh, 300px);

            position: relative;
            overflow: hidden;

            border-radius: clamp(22px, 4vw, 40px);

            background-image: url("1.jpg");
            background-size: cover;
            background-position: center;

            border: 1px solid rgba(0, 0, 0, 0.10);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.13),
                inset 0 1px 0 rgba(255,255,255,0.9);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            transform: perspective(1000px) rotateX(0deg);

            animation:
                headerIn 1.2s ease forwards,
                headerFloat 6s ease-in-out infinite 1.2s;

            flex-shrink: 1;
        }

        /* Glass overlay */

        .header-glass::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.38),
                    rgba(255,255,255,0.05)
                );

            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        /* Glass reflection */

        .header-glass::after {
            content: "";

            position: absolute;

            width: 160%;
            height: 50%;

            top: -10%;
            left: -30%;

            background: rgba(255,255,255,0.30);

            transform: rotate(-8deg);

            filter: blur(25px);

            animation: glassShine 5s ease-in-out infinite;
        }

        /* ================= TEXT CARD ================= */

        .text-glass {
            width: min(850px, 94vw);

            padding:
                clamp(18px, 3vh, 35px)
                clamp(20px, 5vw, 55px);

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.85),
                    rgba(255,255,255,0.55)
                );

            border: 1px solid rgba(0,0,0,0.08);

            border-radius: clamp(22px, 4vw, 38px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.09),
                inset 0 1px 0 rgba(255,255,255,1);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            animation: textIn 1.4s ease forwards;

            flex-shrink: 1;
        }

        .text-glass p {
            font-size: clamp(14px, 2vw, 21px);
            line-height: 1.65;

            color: #000;
        }

        /* ================= DECORATION ================= */

        .orb {
            position: absolute;

            border-radius: 50%;

            background: rgba(255,255,255,0.65);

            border: 1px solid rgba(0,0,0,0.05);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.06);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            pointer-events: none;
        }

        .orb.one {
            width: clamp(70px, 10vw, 150px);
            height: clamp(70px, 10vw, 150px);

            left: -30px;
            top: 18%;

            animation: orbOne 7s ease-in-out infinite;
        }

        .orb.two {
            width: clamp(55px, 8vw, 120px);
            height: clamp(55px, 8vw, 120px);

            right: -25px;
            bottom: 15%;

            animation: orbTwo 8s ease-in-out infinite;
        }

        /* ================= ANIMATIONS ================= */

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(-25px) scale(0.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes nameFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes headerIn {
            from {
                opacity: 0;
                transform:
                    perspective(1000px)
                    rotateX(12deg)
                    scale(0.94);
            }

            to {
                opacity: 1;
                transform:
                    perspective(1000px)
                    rotateX(0)
                    scale(1);
            }
        }

        @keyframes headerFloat {
            0%, 100% {
                transform:
                    perspective(1000px)
                    translateY(0);
            }

            50% {
                transform:
                    perspective(1000px)
                    translateY(-5px);
            }
        }

        @keyframes textIn {
            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes glassShine {
            0% {
                transform: translateX(-30%) rotate(-8deg);
            }

            50% {
                transform: translateX(35%) rotate(-8deg);
            }

            100% {
                transform: translateX(-30%) rotate(-8deg);
            }
        }

        @keyframes orbOne {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(35px, 45px);
            }
        }

        @keyframes orbTwo {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-30px, -35px);
            }
        }

        /* ================= SMALL PHONES ================= */

        @media (max-height: 650px) {

            .page {
                justify-content: space-around;
                padding-top: 8px;
                padding-bottom: 8px;
            }

            .title h1 {
                font-size: clamp(34px, 7vw, 55px);
            }

            .title .name {
                font-size: 18px;
                margin-top: 5px;
            }

            .header-glass {
                height: 24vh;
            }

            .text-glass {
                padding: 15px 20px;
            }

            .text-glass p {
                font-size: 13px;
                line-height: 1.45;
            }
        }

        /* ================= VERY SMALL PHONES ================= */

        @media (max-height: 500px) {

            .title h1 {
                font-size: 30px;
            }

            .title .name {
                font-size: 15px;
            }

            .header-glass {
                height: 22vh;
            }

            .text-glass {
                padding: 10px 15px;
            }

            .text-glass p {
                font-size: 12px;
                line-height: 1.35;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="orb one"></div>
        <div class="orb two"></div>

        <!-- Title -->
        <section class="title">
            <h1>I am Sandy</h1>
            <span class="name">Sandy</span>
        </section>

        <!-- Header Image -->
        <div class="header-glass"></div>

        <!-- Text -->
        <section class="text-glass">
            <p>
                I love my friends so much.
                I am very loyal to them and I truly care about every one of them.
                I love all my friends and appreciate every moment we spend together.
                They make my life happier, and I will always support and care for them.
            </p>
        </section>

    </div>

</body>
</html>
