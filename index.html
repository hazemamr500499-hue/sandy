<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no,
          viewport-fit=cover">

    <title>I am Sandy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;

            overflow-x: hidden;
        }

        body {
            min-height: 100dvh;
        }

        /* ================= PAGE ================= */

        .page {
            width: 100%;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: clamp(20px, 4vw, 55px);

            gap: clamp(20px, 4vh, 45px);

            position: relative;
        }

        /* ================= TITLE ================= */

        .title {
            text-align: center;
            z-index: 2;

            animation: titleIn 1s ease both;
        }

        .title h1 {
            font-size: clamp(42px, 7vw, 85px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -3px;

            color: #000000;

            text-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .name {
            display: block;

            margin-top: 10px;

            font-size: clamp(20px, 3vw, 34px);
            letter-spacing: 6px;

            color: #222222;
        }

        /* ================= HEADER IMAGE ================= */

        .header-wrapper {
            width: min(1584px, 96vw);

            position: relative;

            border-radius: clamp(18px, 3vw, 35px);

            overflow: hidden;

            background: #ffffff;

            border: 1px solid rgba(0, 0, 0, 0.10);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.12),
                0 5px 20px rgba(0, 0, 0, 0.06);

            animation: imageIn 1.2s cubic-bezier(.2,.8,.2,1) both;
        }

        /*
            مهم جدًا:
            الصورة هنا ليست background.
            لذلك لن يتم قصها.
        */

        .header-wrapper img {
            display: block;

            width: 100%;
            height: auto;

            max-width: 100%;

            object-fit: contain;

            vertical-align: middle;

            /* ممنوع أي طبقة فوق الصورة */
            filter: none;

            opacity: 1;
        }

        /* Glass reflection فقط على الحواف،
           وليس فوق الصورة */

        .header-wrapper .glass-edge {
            position: absolute;
            inset: 0;

            pointer-events: none;

            border-radius: inherit;

            border: 1px solid rgba(255, 255, 255, 0.55);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.75);

            z-index: 2;
        }

        /* ================= TEXT ================= */

        .text-card {
            width: min(900px, 94vw);

            padding: clamp(25px, 4vw, 45px);

            text-align: center;

            background: rgba(255, 255, 255, 0.72);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border: 1px solid rgba(0, 0, 0, 0.08);

            border-radius: clamp(22px, 4vw, 38px);

            box-shadow:
                0 25px 65px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255,255,255,0.9);

            animation: textIn 1.4s ease both;
        }

        .text-card p {
            font-size: clamp(16px, 2vw, 21px);

            line-height: 1.75;

            color: #000000;
        }

        /* ================= GLASS CIRCLES ================= */

        .glass-circle {
            position: fixed;

            border-radius: 50%;

            background: rgba(255,255,255,0.45);

            border: 1px solid rgba(0,0,0,0.05);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.06);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            pointer-events: none;

            z-index: 0;
        }

        .circle-one {
            width: clamp(80px, 10vw, 150px);
            height: clamp(80px, 10vw, 150px);

            left: -40px;
            top: 25%;

            animation: floatOne 7s ease-in-out infinite;
        }

        .circle-two {
            width: clamp(60px, 8vw, 120px);
            height: clamp(60px, 8vw, 120px);

            right: -30px;
            bottom: 15%;

            animation: floatTwo 8s ease-in-out infinite;
        }

        /* ================= ANIMATIONS ================= */

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes imageIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes textIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatOne {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 35px);
            }
        }

        @keyframes floatTwo {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-25px, -30px);
            }
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .page {
                padding: 18px 12px 25px;

                gap: 22px;
            }

            .title h1 {
                font-size: clamp(40px, 12vw, 58px);

                letter-spacing: -2px;
            }

            .name {
                font-size: 19px;

                letter-spacing: 4px;
            }

            .header-wrapper {
                width: 100%;

                border-radius: 20px;
            }

            /*
                نفس نسبة الصورة الأصلية.
                لا قص ولا zoom ولا background.
            */

            .header-wrapper img {
                width: 100%;
                height: auto;
            }

            .text-card {
                width: 100%;

                padding: 25px 20px;

                border-radius: 25px;
            }

            .text-card p {
                font-size: 16px;

                line-height: 1.7;
            }
        }

        /* ================= VERY SMALL PHONES ================= */

        @media (max-width: 380px) {

            .page {
                padding-top: 14px;
                gap: 17px;
            }

            .title h1 {
                font-size: 38px;
            }

            .name {
                font-size: 17px;
            }

            .text-card {
                padding: 20px 16px;
            }

            .text-card p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="glass-circle circle-one"></div>
        <div class="glass-circle circle-two"></div>

        <!-- TITLE -->
        <section class="title">
            <h1>I am Sandy</h1>
            <span class="name">Sandy</span>
        </section>

        <!-- HEADER IMAGE -->
        <div class="header-wrapper">

            <img src="1.jpg" alt="Sandy Header">

            <div class="glass-edge"></div>

        </div>

        <!-- TEXT -->
        <section class="text-card">

            <p>
                I love my friends so much.
                I am very loyal to them and I truly care about every one of them.
                I love all my friends and appreciate every moment we spend together.
                They make my life happier, and I will always support and care for them.
            </p>

        </section>

    </div>

</body>
</html>
